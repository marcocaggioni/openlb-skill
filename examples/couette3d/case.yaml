# Couette rheometer — OpenLB 3D example case.
# Same geometry and fluid as the 2D case (examples/couette/case.yaml)
# and the Palabos / XLB / OpenFOAM examples, so the solvers can be
# compared point for point. Everything here is a labelled default:
# confirm before running. Do NOT change the case numbers — this file
# is the contract, and couette3d.cpp must stay in sync with it.

geometry:
  R_i: 0.020        # m, rotating inner cylinder (bob)
  R_o: 0.025        # m, fixed outer cylinder (cup)
  L: 0.060          # m, wetted length (axial extent; periodic in Z,
                    # so no end effects — same infinite-cylinder
                    # assumption as the 2D case)
  axis: Z
  dimension: 3D     # full annulus, D3Q19

fluid:
  model: newtonian
  eta_Pa_s: 1.0
  rho_kg_m3: 1000.0

sweep:
  shear_rate_1_s: [0.1, 0.3, 1, 3, 10, 30, 100]   # log-spaced (2D list, kept for reference)
  run_gamma_1_s: 10.0    # this example runs gamma = 10 1/s only
  run_time_s: 1.0        # per point; viscous diffusion time gap^2/nu ~ 0.025 s
  ramp_time_s: 0.2       # quarter-sine ramp of Omega, avoids a start-up shock
  steady_window_fraction: 0.2   # average torque over the last 20% of the run

lattice:
  cells_across_gap: 10   # default; dx = gap / 10 = 0.5 mm (same as 2D)
  omega: 1.0             # relaxation frequency; dt is solved from this (see lattice3d.py)
  max_lattice_velocity: 0.1   # hard check: u_lb at the highest shear rate must stay below this
  mpi_ranks: 1

run:
  dry_run: true   # default: lattice params + build only, no solver run
  openlb_dir: ~/openlb   # where `git clone https://gitlab.com/openlb/release.git` lives
