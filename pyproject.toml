[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlb-skill"
version = "0.1.0"
description = "Skill teaching an agent to run open-source OpenLB lattice Boltzmann simulations from an English discussion — starting with a Couette rheometer flow curve."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false

# NOTE: OpenLB itself has no PyPI package — it is a C++ library, not
# Python. `uv sync` installs the Python side of this repo only
# (lattice conversion, sweep, post-processing, video rendering).
# The OpenLB C++ library is fetched and built separately:
#   bash scripts/install-openlb.sh
# That clones https://gitlab.com/openlb/release.git and sets
# OPENLB_ROOT; the Couette case is then built with GNU Make.
# See docs/openlb-guide.md and QUICKSTART.md.
